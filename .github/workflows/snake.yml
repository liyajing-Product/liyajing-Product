name: Generate snake animation

on:
  schedule:
    # 每 12 小时刷新一次，让贪吃蛇跟上新的贡献
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF8C00&color_dots=%23fff5e6,%23ffd9a8,%23ffb866,%23ff8c00,%23e06f00
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF8C00&color_dots=%23161b22,%234a341c,%237a4a12,%23c07000,%23ff9a2e

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
